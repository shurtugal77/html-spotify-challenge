<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Spotify</title>
    <script src="https://kit.fontawesome.com/5245b43c9e.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="top-menu">
        <a class="update-app-button" href="">Update your App</a>
    </header>

    <nav class="left-nav">
        <header class="logo">
            <img class="object-fit-contain" src="./assets/img/logo.svg" alt="">
        </header>

        <aside>
            <section class="left-menu">
                <a class="left-menu-button" href="">
                    <img class="object-fit-contain left-menu-icons" src="./assets/img/home.svg" alt="">
                    <h3>Home</h3>
                </a>
                <a class="left-menu-button" href="">
                    <img class="object-fit-contain left-menu-icons" src="./assets/img/search.svg" alt="">
                    <h3>Search</h3>
                </a>
                <a class="left-menu-button" href="">
                    <img class="object-fit-contain left-menu-icons" src="./assets/img/libreria.svg" alt="">
                    <h3>Library</h3>
                </a>
            </section>

            <section class="playlist-menu">
                <h3>Playlist</h3>
                <div class="create-playlist-container">
                    <img class="object-fit-contain create-playlist-icon" src="./assets/img/playlist-plus-square.svg" alt="">
                    <p>Create Playlist</p>
                </div>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
                <p class="playlist-entry">Playlist Name</p>
            </section>
            
            <section class="profile-menu">
                <div class="app-install-container">
                    <img class="object-fit-contain app-install-icon" src="./assets/img/download.svg" alt="">
                    <p class="app-install-text">Install app</p>
                </div>
                <div class="line-divider"></div>
                <div class="profile-container">
                    <img class="profile-icon" src="./assets/img/profile.svg" alt="">
                    <p class="profile-text">John Doe</p>
                </div>
            </section>
        </aside>
    </nav>

    <main>
        <section class="albums">
            <p>Main Albums Artists</p>
        </section>
    </main>

    <footer>
        <section class="active-song">
            <img class="object-fit-contain active-song-image" src="./assets/img/sinister.jpeg" alt="">
            <div class="active-song-details">
                <p class="active-song-name">Song name</p>
                <p class="active-song-interpret">Band Name</p>
            </div>
            <img class="active-song-icon" src="./assets/img/love.svg" alt="">
            <img class="active-song-icon" src="./assets/img/browse.svg" alt="">
        </section>

        <section class="player-controls">
            <section class="control-buttons">
                <a href=""><img src="./assets/img/shuffle.svg" alt=""></a>
                <a href=""><img src="./assets/img/rewind.svg" alt=""></a>
                <a href=""><img id="play-button" src="./assets/img/play.svg" alt=""></a>
                <a href=""><img src="./assets/img/forward.svg" alt=""></a>
                <a href=""><img src="./assets/img/repeat.svg" alt=""></a>
            </section>

            <section class="progress-bar">
                <p></p>
                <div>Background with progress</div>
                <p>Time Remaining</p>
            </section>

        </section>
        <section class="volume-control">
            <!-- Volume Control -->
        </section>
    </footer>
</body>
</html>
